name: Deploy GymTracker PWA to GitHub Pages

on:
  push:
    branches:
      - claude/gym-workout-tracker-app-xeLqJ
    paths:
      - 'GymTrackerPWA/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: GymTrackerPWA/package-lock.json

      - name: Install dependencies
        run: cd GymTrackerPWA && npm ci

      - name: Build
        run: cd GymTrackerPWA && npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: GymTrackerPWA/dist
          branch: gh-pages
          clean: true
