name: Deploy GymTracker PWA to GitHub Pages

on:
  push:
    branches:
      - claude/gym-workout-tracker-app-xeLqJ
    paths:
      - 'GymTrackerPWA/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: GymTrackerPWA/package-lock.json

      - name: Install dependencies
        run: cd GymTrackerPWA && npm ci

      - name: Build
        run: cd GymTrackerPWA && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: GymTrackerPWA/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
